<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            overflow:hidden;
        }

        /* Animated Background Circles */

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.2);
            animation:float 6s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:200px;
            height:200px;
            top:10%;
            left:10%;
        }

        .circle:nth-child(2){
            width:300px;
            height:300px;
            bottom:10%;
            right:10%;
            animation-delay:2s;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        /* Main Card */

        .reset-container{
            position:relative;
            z-index:10;
            width:420px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            padding:40px;
            border-radius:25px;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .icon-box{
            width:90px;
            height:90px;
            margin:auto;
            background:white;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }

        .icon-box i{
            font-size:40px;
            color:#4A6CF7;
        }

        h2{
            text-align:center;
            font-weight:700;
            color:white;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#f1f1f1;
            margin-bottom:30px;
            font-size:14px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            border:none;
            padding-left:45px;
            font-size:15px;
        }

        .input-group{
            position:relative;
            margin-bottom:20px;
        }

        .input-group i{
            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#555;
            z-index:100;
        }

        .btn-reset{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#4A6CF7,#6A8DFF);
            color:white;
            font-weight:600;
            font-size:16px;
            transition:0.3s;
        }

        .btn-reset:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(74,108,247,0.4);
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
            color:white;
            font-size:14px;
        }

        .bottom-text a{
            color:#fff;
            font-weight:600;
            text-decoration:none;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

    <!-- Background Animation -->
    <div class="circle"></div>
    <div class="circle"></div>

    <!-- Reset Password Card -->
    <div class="reset-container">

        <div class="icon-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a strong new password to secure your account
        </p>

        <form method="POST">

            <!-- New Password -->
            <div class="input-group">
                <i class="bi bi-lock-fill"></i>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter New Password"
                       required>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <i class="bi bi-check-circle-fill"></i>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm Password"
                       required>
            </div>

            <!-- Button -->
            <button type="submit" class="btn-reset">
                <i class="bi bi-arrow-repeat"></i>
                Update Password
            </button>

        </form>

        <div class="bottom-text">
            Remember your password?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
