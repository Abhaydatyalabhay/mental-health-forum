```html
<!-- ================= NAVBAR ================= -->

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.top-navbar{
    width:100%;
    background:linear-gradient(135deg,#ece4a8,#f4efc7);
    padding:20px 35px;

    display:flex;
    flex-direction:column;
    gap:30px;

    position:relative;

    box-shadow:0 4px 18px rgba(0,0,0,0.05);
}

/* ================= TOP ROW ================= */

.top-row{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    position:relative;
}

/* ================= LEFT SIDE ================= */

.left-side{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.logo-img{
    width:160px;
}

/* ================= MENTAL BOX ================= */

.mental-box{
    background:white;
    padding:18px 22px;

    border-radius:22px;

    display:flex;
    align-items:center;
    gap:16px;

    width:320px;

    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.mental-box i{
    font-size:42px;
    color:#22c55e;
}

.mental-box h4{
    margin:0;
    font-weight:800;
    color:#111827;
    font-size:2rem;
    line-height:1.1;
}

/* ================= LOGOUT ================= */

.logout-box{
    position:absolute;
    top:0;
    right:0;
}

.logout-btn{
    background:linear-gradient(135deg,#ff4b2b,#ff416c);
    color:white;
    padding:12px 20px;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;

    display:flex;
    align-items:center;
    gap:8px;

    transition:0.3s;

    box-shadow:0 5px 14px rgba(0,0,0,0.08);
}

.logout-btn:hover{
    transform:translateY(-3px);
    color:white;
}

/* ================= NAVIGATION ================= */

.nav-center{
    width:100%;

    display:flex;
    gap:15px;

    flex-wrap:wrap;

    align-items:center;
}

/* ================= NAV BUTTON ================= */

.nav-item{
    text-decoration:none;

    padding:12px 22px;

    border-radius:16px;

    font-weight:600;

    transition:0.3s;

    color:white;

    display:flex;
    align-items:center;
    gap:8px;

    font-size:15px;

    box-shadow:0 6px 14px rgba(0,0,0,0.08);

    border:none;
}

.nav-item:hover{
    transform:translateY(-3px);
    color:white;
}

/* ================= COLORS ================= */

.home-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.help-btn{
    background:linear-gradient(135deg,#ff512f,#dd2476);
    color:white;
}

.about-btn{
    background:linear-gradient(135deg,#ff6a00,#ee0979);
}

.community-btn{
    background:linear-gradient(135deg,#7b2ff7,#f107a3);
}

.chatbot-btn{
    background:linear-gradient(135deg,#ffb347,#ffcc33);
    color:#111827;
}

.create-btn{
    background:linear-gradient(135deg,#11998e,#38ef7d);
}

.mypost-btn{
    background:linear-gradient(135deg,#8e2de2,#4a00e0);
}

/* ================= DROPDOWN ================= */

.dropdown-menu{
    border:none;
    border-radius:16px;
    padding:10px;

    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.dropdown-item{
    padding:10px 12px;
    border-radius:10px;

    font-size:14px;
    font-weight:600;

    margin-bottom:4px;

    transition:0.3s;
}

.dropdown-item:hover{
    background:#eef4ff;
    transform:translateX(4px);
}

/* ================= MOBILE ================= */

@media(max-width:992px){

    .top-row{
        flex-direction:column;
        align-items:center;
        gap:25px;
    }

    .logout-box{
        position:static;
    }

    .left-side{
        align-items:center;
    }

    .nav-center{
        justify-content:center;
    }

}

@media(max-width:768px){

    .mental-box{
        width:100%;
    }

    .mental-box h4{
        font-size:1.5rem;
    }

    .nav-center{
        flex-direction:column;
    }

    .nav-item{
        width:100%;
        justify-content:center;
    }

}

</style>

<!-- ================= NAVBAR ================= -->

<div class="top-navbar">

    <!-- TOP ROW -->

    <div class="top-row">

        <!-- LEFT -->

        <div class="left-side">

            <!-- LOGO -->

            <img src="https://www.vandrevalafoundation.com/wp-content/themes/vandrevala/images/logo.png"
                 alt="logo"
                 class="logo-img">

            <!-- MENTAL HEALTH -->

            <div class="mental-box">

                <i class="bi bi-heart-pulse-fill"></i>

                <div>
                    <h4>Mental Health</h4>
                </div>

            </div>

        </div>

        <!-- LOGOUT -->

        <div class="logout-box">

            <a href="{{ url_for('logout') }}"
               class="logout-btn">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </a>

        </div>

    </div>

    <!-- ================= NAVIGATION ================= -->

    <div class="nav-center">

        <!-- HOME -->

        <a href="{{ url_for('home') }}"
           class="nav-item home-btn">

            <i class="bi bi-house-door-fill"></i>
            Home

        </a>

        <!-- GET HELP -->

        <div class="dropdown">

            <button class="nav-item help-btn dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown">

                <i class="bi bi-life-preserver"></i>
                Get Help

            </button>

            <ul class="dropdown-menu">

                <li>

                    <a class="dropdown-item"
                       href="{{ url_for('stress_management') }}">

                        <i class="bi bi-emoji-smile text-danger"></i>
                        Stress Management

                    </a>

                </li>

                <li>

                    <a class="dropdown-item"
                       href="{{ url_for('anxiety_support') }}">

                        <i class="bi bi-shield-heart text-primary"></i>
                        Anxiety Support

                    </a>

                </li>

                <li>

                    <a class="dropdown-item"
                       href="{{ url_for('self_care') }}">

                        <i class="bi bi-flower1 text-success"></i>
                        Self Care

                    </a>

                </li>

            </ul>

        </div>

        <!-- ABOUT -->

        <a href="{{ url_for('about_us') }}"
           class="nav-item about-btn">

            <i class="bi bi-info-circle-fill"></i>
            About Us

        </a>

        <!-- COMMUNITY -->

        <a href="{{ url_for('community') }}"
           class="nav-item community-btn">

            <i class="bi bi-people-fill"></i>
            Community

        </a>

        <!-- CHATBOT -->

        <a href="{{ url_for('chatbot') }}"
           class="nav-item chatbot-btn">

            <i class="bi bi-robot"></i>
            Chatbot

        </a>

        <!-- CREATE POST -->

        <a href="{{ url_for('create_post') }}"
           class="nav-item create-btn">

            <i class="bi bi-plus-circle"></i>
            Create Post

        </a>

        <!-- MY POSTS -->

        <a href="{{ url_for('my_posts') }}"
           class="nav-item mypost-btn">

            <i class="bi bi-journal-text"></i>
            My Posts

        </a>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
