<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:linear-gradient(135deg,#667eea,#764ba2);
            position:relative;
        }

        /* Animated Background */

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            animation:float 6s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:220px;
            height:220px;
            top:8%;
            left:8%;
        }

        .circle:nth-child(2){
            width:320px;
            height:320px;
            bottom:5%;
            right:5%;
            animation-delay:2s;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-25px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        /* Main Card */

        .forgot-container{
            position:relative;
            z-index:10;
            width:430px;
            padding:40px;
            border-radius:25px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* Icon */

        .icon-box{
            width:90px;
            height:90px;
            margin:auto;
            margin-bottom:20px;
            border-radius:50%;
            background:white;
            display:flex;
            justify-content:center;
            align-items:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .icon-box i{
            font-size:40px;
            color:#764ba2;
        }

        h2{
            text-align:center;
            color:white;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#f3f3f3;
            font-size:14px;
            margin-bottom:30px;
        }

        /* Input */

        .input-group{
            position:relative;
            margin-bottom:25px;
        }

        .input-group i{
            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#555;
            z-index:100;
        }

        .form-control{
            height:52px;
            border:none;
            border-radius:12px;
            padding-left:45px;
            font-size:15px;
        }

        .form-control:focus{
            box-shadow:0 0 10px rgba(255,255,255,0.5);
        }

        /* Button */

        .btn-reset{
            width:100%;
            height:52px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            color:white;
            font-size:16px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-reset:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(255,118,140,0.4);
        }

        /* Footer */

        .bottom-text{
            margin-top:20px;
            text-align:center;
            color:white;
            font-size:14px;
        }

        .bottom-text a{
            color:#fff;
            font-weight:600;
            text-decoration:none;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

    <!-- Background -->
    <div class="circle"></div>
    <div class="circle"></div>

    <!-- Forgot Password Card -->
    <div class="forgot-container">

        <div class="icon-box">
            <i class="bi bi-envelope-lock-fill"></i>
        </div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Don't worry! Enter your email and we'll send you a password reset link.
        </p>

        <form method="POST">

            <!-- Email Input -->
            <div class="input-group">

                <i class="bi bi-envelope-fill"></i>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email address"
                       required>

            </div>

            <!-- Button -->
            <button type="submit" class="btn-reset">
                <i class="bi bi-send-fill"></i>
                Send Reset Link
            </button>

        </form>

        <!-- Footer -->
        <div class="bottom-text">
            Remember your password?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
