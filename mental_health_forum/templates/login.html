```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        /* LOGIN BOX */

        .login-box{
            width:420px;
            background:white;
            padding:40px;
            border-radius:25px;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
            animation:fadeIn 0.8s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        /* LOGO */

        .logo{
            width:85px;
            height:85px;
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 20px;
            color:white;
            font-size:38px;
            box-shadow:0 8px 20px rgba(37,99,235,0.4);
        }

        /* TITLE */

        .login-box h2{
            text-align:center;
            font-weight:700;
            color:#0f172a;
        }

        .subtitle{
            text-align:center;
            color:#64748b;
            margin-top:10px;
            margin-bottom:30px;
            font-size:15px;
        }

        /* FORM */

        .form-label{
            font-weight:600;
            color:#334155;
            margin-bottom:8px;
        }

        .input-group{
            margin-bottom:22px;
            border-radius:12px;
            overflow:hidden;
            transition:0.3s;
        }

        .input-group:focus-within{
            box-shadow:0 0 0 3px rgba(37,99,235,0.15);
        }

        .input-group-text{
            background:#e2e8f0;
            border:none;
            color:#334155;
        }

        .form-control{
            border:none;
            background:#f8fafc;
            height:52px;
            color:#1e293b;
        }

        .form-control:focus{
            box-shadow:none;
            background:#f1f5f9;
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        /* EYE BUTTON */

        .eye-btn{
            cursor:pointer;
            transition:0.3s;
        }

        .eye-btn:hover{
            background:#cbd5e1;
        }

        /* FORGOT PASSWORD */

        .forgot{
            text-align:right;
            margin-top:-10px;
            margin-bottom:20px;
        }

        .forgot a{
            color:#2563eb;
            text-decoration:none;
            font-size:14px;
            font-weight:500;
        }

        .forgot a:hover{
            text-decoration:underline;
        }

        /* BUTTON */

        .btn-login{
            width:100%;
            border:none;
            padding:14px;
            border-radius:14px;
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            font-weight:600;
            font-size:16px;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(37,99,235,0.3);
        }

        .btn-login:active{
            transform:scale(0.98);
        }

        /* DIVIDER */

        .divider{
            display:flex;
            align-items:center;
            margin:25px 0;
            color:#94a3b8;
            font-size:14px;
        }

        .divider::before,
        .divider::after{
            content:'';
            flex:1;
            height:1px;
            background:#e2e8f0;
        }

        .divider span{
            padding:0 12px;
        }

        /* REGISTER */

        .register-text{
            text-align:center;
            color:#475569;
        }

        .register-text a{
            color:#2563eb;
            font-weight:600;
            text-decoration:none;
        }

        .register-text a:hover{
            text-decoration:underline;
        }

        /* ALERT */

        .alert{
            border-radius:12px;
            font-size:14px;
        }

        /* MOBILE */

        @media(max-width:500px){

            .login-box{
                width:100%;
                padding:30px 22px;
            }

        }

    </style>
</head>

<body>

    <!-- LOGIN BOX -->

    <div class="login-box">

        <!-- LOGO -->

        <div class="logo">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>

        <!-- TITLE -->

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to continue your wellness journey ❤️
        </p>

        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORM -->

        <form method="POST">

            <!-- EMAIL -->

            <label class="form-label">Email</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-envelope-fill"></i>
                </span>

                <input 
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <!-- PASSWORD -->

            <label class="form-label">Password</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input 
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

                <span 
                    class="input-group-text eye-btn"
                    onclick="togglePassword()"
                >
                    <i class="bi bi-eye-fill" id="toggleIcon"></i>
                </span>

            </div>

            <!-- FORGOT PASSWORD -->

            <div class="forgot">

                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>

            </div>

            <!-- LOGIN BUTTON -->

            <button type="submit" class="btn-login" id="loginBtn">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <!-- DIVIDER -->

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

    <!-- PASSWORD SHOW/HIDE SCRIPT -->

    <script>

        function togglePassword(){

            const password = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");

            if(password.type === "password"){

                password.type = "text";

                icon.classList.remove("bi-eye-fill");
                icon.classList.add("bi-eye-slash-fill");

            }
            else{

                password.type = "password";

                icon.classList.remove("bi-eye-slash-fill");
                icon.classList.add("bi-eye-fill");

            }

        }

        // LOGIN BUTTON LOADING EFFECT

        const form = document.querySelector("form");
        const btn = document.getElementById("loginBtn");

        form.addEventListener("submit", function(){

            btn.innerHTML = `
                <span class="spinner-border spinner-border-sm"></span>
                Logging in...
            `;

        });

    </script>

</body>
</html>
